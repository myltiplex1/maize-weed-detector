# Light and dark themes - visitors can switch in the ⋮ menu → Settings → Theme
[theme]
font = "sans serif"

[theme.light]
primaryColor = "#1d6b3a"
backgroundColor = "#f6f8f4"
secondaryBackgroundColor = "#eaf0e7"
textColor = "#18261c"

[theme.dark]
primaryColor = "#3fbf6a"
backgroundColor = "#0e1511"
secondaryBackgroundColor = "#17221b"
textColor = "#e4ede6"

[server]
maxUploadSize = 200

[browser]
gatherUsageStats = false
